<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background glow / gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container (Squircle / Rounded Hexagon with Pulse waveform) -->
  <g transform="translate(40, 25)">
    <!-- Rounded Background Box -->
    <rect x="0" y="0" width="150" height="150" rx="36" fill="#0F172A" stroke="url(#pulseGrad)" stroke-width="3" />
    
    <!-- Subtle Inner Accent -->
    <rect x="8" y="8" width="134" height="134" rx="28" fill="#1E293B" fill-opacity="0.5" />

    <!-- Pulse Wave Line -->
    <path d="M 22 75 L 50 75 L 62 48 L 76 102 L 92 30 L 104 110 L 114 75 L 128 75" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)" />

    <!-- Pulse Points -->
    <circle cx="92" cy="30" r="4" fill="#00F2FE" />
    <circle cx="104" cy="110" r="4" fill="#6B11FF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(225, 110)">
    <!-- PULSE Title -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="6" 
          fill="url(#textGrad)">PULSE</text>
    
    <!-- Subtitle / Value Prop -->
    <text y="38" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="2" 
          fill="#94A3B8">DISTRIBUTED REAL-TIME MESSAGING ENGINE</text>
  </g>
</svg>

